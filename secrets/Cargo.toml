[package]
name = "torq-secrets"
version = "0.3.2"
edition = "2021"
rust-version = "1.89"
description = "TorqOS's secrets daemon: a program uses a secret in an HTTPS request and never reads it (ADR-052)"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
rustix = { version = "1.1.6", features = ["process", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
torq-wire = { path = "../wire" }
